# Configuración de CodeRabbit para eduConnect Frontend
# https://docs.coderabbit.ai/guides/configure-coderabbit

# Habilitar revisiones automáticas
reviews:
  # Mostrar estado de revisión en PRs
  review_status: true
  
  # Configuración de revisión automática
  auto_review:
    enabled: true
    
    # Ramas base que deben ser revisadas automáticamente
    base_branches:
      - main
      - dev  # Rama principal de desarrollo
    
    # Drafts también serán revisados
    drafts: true
  
  # Configuración de solicitud de cambios
  request_changes_workflow: false

# Configuración de comentarios
chat:
  # Habilitar autorespuestas
  auto_reply: true

# Lenguaje de los comentarios
language: es
