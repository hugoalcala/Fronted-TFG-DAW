[build]
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  # Para desarrollo local, usa .env.local
  # Para producción en Netlify, agrega las variables en Netlify Dashboard:
  # Site settings → Build & deploy → Environment → Environment variables
  
  NODE_VERSION = "18.17.0"
  NODE_ENV = "production"
  # VITE_API_BASE_URL = https://api-tuapp.render.com/api (agregar en Netlify Dashboard)
  # VITE_GOOGLE_CLIENT_ID = (agregar en Netlify Dashboard)

# Redirige todas las rutas a index.html para React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/dist/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
